name = "clipforge-api"
main = "src/index.ts"
compatibility_date = "2026-11-12"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "clipforge-app-db"
database_id = "664858ab-96b6-435a-96da-95cdbd110c5a"
migrations_dir = "../../database/migrations"

# Backblaze B2 is configured through B2_ENDPOINT, B2_REGION and B2_BUCKET vars,
# plus B2_ACCESS_KEY_ID and B2_SECRET_ACCESS_KEY Worker secrets.
# Do not add R2 bindings when OBJECT_STORAGE_PROVIDER is Backblaze.

# Jobs are claimed directly from D1 by the authenticated Python processor.
# Configure PROCESSOR_SHARED_SECRET with: wrangler secret put PROCESSOR_SHARED_SECRET

[vars]
ACCESS_TEAM_DOMAIN = "little-base-dedb.cloudflareaccess.com"
ACCESS_AUD = "72fac205e59e7770aaecb3ec09d3cac80c31a4e1146b785eef23f3322600ff2c"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET = "clipforge-private-media"

# Serve the Vite application and authenticated API from one protected origin.
# Run npm run build:web (also part of npm run deploy) before deploying.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/internal/processor/*", "/health"]
