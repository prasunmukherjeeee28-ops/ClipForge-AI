name = "clipforge-api"
main = "src/index.ts"
compatibility_date = "2026-11-12"
workers_dev = true

[observability]
enabled = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "clipforge-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "clipforge-private-media"

[[queues.producers]]
binding = "JOB_QUEUE"
queue = "clipforge-jobs"

[[queues.consumers]]
queue = "clipforge-jobs"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "clipforge-jobs-dlq"

# Configure the processor service after deploying services/processor.
[[services]]
binding = "PROCESSOR"
service = "clipforge-processor"

[vars]
ACCESS_TEAM_DOMAIN = "YOUR_TEAM.cloudflareaccess.com"
ACCESS_AUD = "SET_CLOUDFLARE_ACCESS_APPLICATION_AUD"
ALLOWED_EMAILS = "first-user@example.com,second-user@example.com"
