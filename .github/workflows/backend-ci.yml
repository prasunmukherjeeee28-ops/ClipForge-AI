name: Backend CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/api/**"
      - "services/processor/**"
      - ".github/workflows/backend-ci.yml"
      - "compose.processor.yaml"
      - ".gitignore"
      - ".dockerignore"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "services/processor/**"
      - ".github/workflows/backend-ci.yml"
      - "compose.processor.yaml"
      - ".gitignore"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-typecheck:
    name: Cloudflare Worker API typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        run: npm install
      - name: Test object storage adapter
        run: npm test
      - name: Typecheck Worker API
        run: npm run typecheck
      - name: Build the PWA for Worker Static Assets
        run: npm run build:web
      - name: Validate the combined Worker and static asset bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/clipforge-worker-dry-run

  processor-tests:
    name: Python processor unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/processor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/processor/pyproject.toml
      - name: Install FFmpeg for real media integration coverage
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install processor and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run processor tests
        run: python -m pytest -q
      - name: Build processor container image
        run: docker build --file Dockerfile --tag clipforge-processor:ci ../..
