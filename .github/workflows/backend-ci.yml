name: Backend CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/api/**"
      - "services/processor/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "services/processor/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-typecheck:
    name: Cloudflare Worker API typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        run: npm install
      - name: Typecheck Worker API
        run: npm run typecheck

  processor-tests:
    name: Python processor unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/processor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/processor/pyproject.toml
      - name: Install processor and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run processor tests
        run: python -m pytest -q
