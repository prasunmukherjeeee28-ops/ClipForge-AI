name: Frontend CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
