name: Build ClipForge Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Build web assets
        working-directory: apps/web
        env:
          VITE_CLIPFORGE_API_BASE_URL: https://clipforge-api.prasunmukherjeeee28.workers.dev
        run: npm run build

      - name: Generate Android project
        working-directory: apps/web
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-android.mjs

          cat >> android/build.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name.startsWith('kotlin-stdlib')) {
                  details.useVersion '1.8.22'
                }
              }
            }
          }
          EOF

      - name: Build APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
