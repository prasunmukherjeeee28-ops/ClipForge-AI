
name: Build ClipForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Install Capacitor
        working-directory: apps/web
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Setup Android
        working-directory: apps/web
        run: |
          npx cap init ClipForge com.clipforge.app --web-dir dist
          npx cap add android
          npx cap sync android

          cat >> android/build.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name.startsWith('kotlin-stdlib')) {
                  details.useVersion '1.8.22'
                }
              }
            }
          }
          EOF

      - name: Build APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
