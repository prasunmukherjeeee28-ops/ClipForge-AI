[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge-processor"
version = "0.1.0"
description = "Private ClipForge D1 polling worker scaffold"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "faster-whisper>=1.2.1,<2", "pydantic>=2.7,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
